[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "almatjar-althaki"
version = "1.0.0"
authors = [{ name = "Farhan Almutairi", email = "far7an.o88@gmail.com" }]
description = "Smart store-in-a-box core."
requires-python = ">=3.11"
readme = "README.md"
license = { text = "Proprietary" }

[project.scripts]
almatjar-althaki = "almatjar_althaki.cli:main"

[tool.setuptools]
packages = ["almatjar_althaki"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
